[project]
name = "pulp-ui"
version = "0.1.1"
description = "A small, read-only web UI for browsing a Pulp server's distributions and content."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.5",
]

[project.urls]
Homepage = "https://github.com/e-breuninger/pulp-ui"
Repository = "https://github.com/e-breuninger/pulp-ui"
Issues = "https://github.com/e-breuninger/pulp-ui/issues"
Changelog = "https://github.com/e-breuninger/pulp-ui/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "commitizen>=4.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
# Matches the tag pattern release.yml publishes images for.
tag_format = "v$version"
update_changelog_on_bump = true
# Keeps the hand-written preamble and older entries instead of regenerating
# the whole file from history on every bump.
changelog_incremental = true
# Lightweight tags are invisible to `git push --follow-tags`, which would leave
# a released version untagged on the remote.
annotated_tag = true
# uv.lock records the project version too, so it has to move in the same commit.
pre_bump_hooks = ["uv lock && git add uv.lock"]
