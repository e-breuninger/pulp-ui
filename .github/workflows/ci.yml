name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest

  commit-messages:
    # Local hooks can be skipped and fork PRs never ran them, so enforce here too.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Check the PR's commits against Conventional Commits
        run: |
          uv run cz check --rev-range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - uses: pre-commit/action@v3.0.1
        env:
          # A local guard against committing straight to main; in CI the checkout
          # is on main by definition, so it would fail every push.
          SKIP: no-commit-to-branch

  build:
    # Catches a broken Dockerfile on PRs, where release.yml doesn't run. No push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
