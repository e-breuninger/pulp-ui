name: Publish container image

# Called by release.yml. With a version it publishes the semver tags and
# `latest`; without one it publishes `edge`, so main always has a testable image.
on:
  workflow_call:
    inputs:
      version:
        description: Released version, without the leading v. Empty builds edge.
        type: string
        default: ""
      ref:
        description: Git ref to build. Defaults to the triggering commit.
        type: string
        default: ""
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      image:
        value: ${{ jobs.publish.outputs.image }}
  workflow_dispatch:
    inputs:
      version:
        description: Released version, without the leading v. Empty builds edge.
        type: string
        default: ""
      ref:
        description: Git ref to build. Defaults to the triggering commit.
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  # Lets the build request a Sigstore certificate for keyless signing.
  id-token: write

env:
  IMAGE_NAME: pulp-ui

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # GHCR requires a lowercase e-breuninger; the repository owner may not be.
      - name: Resolve the image name
        id: target
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=edge,branch=main,enable=${{ inputs.version == '' }}
            type=sha,format=long

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the published digest
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
